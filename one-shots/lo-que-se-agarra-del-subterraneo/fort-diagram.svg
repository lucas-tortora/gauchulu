<?xml version="1.0" encoding="UTF-8"?>
<!--
  FORTÍN SANTA BÁRBARA — MAPA DEL FUERTE
  "Lo que se Agarra del Subterráneo" — one-shot, 1826

  The fort with its back to the settled country (north) and its gate facing
  south — a short distance south of the fort, the zanja: a STRAIGHT
  defensive ditch cut across the open ground as part of a frontier line
  running for leagues in both directions (Campaña del Desierto style, cf.
  Zanja de Alsina), NOT a moat around the fort. The cart road crosses it on
  a causeway. Three blast holes sit along it. North is up throughout.

  No basement in this version — it's an action sidequest, not an
  investigation piece. Success is physical: collapse the tunnels, deal with
  La Vieja. See "El Desenlace" in scenario.md.

  Not to strict scale — a running map, not a survey.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f4ecd8"/>
      <stop offset="80%" stop-color="#e6d8b8"/>
      <stop offset="100%" stop-color="#c9b78e"/>
    </radialGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a6a4a" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <radialGradient id="holeGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a2a1a"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="830" fill="url(#parchment)"/>

  <!-- ===================================================== -->
  <!-- TITLE / COMPASS / SCALE                                 -->
  <!-- ===================================================== -->
  <text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#3a2a1a">FORTÍN SANTA BÁRBARA</text>
  <text x="500" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#5a4530">1826 — mapa de mesa, no a escala</text>

  <g transform="translate(895,95)">
    <circle r="34" fill="#f4ecd8" stroke="#5a4530" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#5a4530" stroke-width="1.5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#5a4530" stroke-width="1.5"/>
    <polygon points="0,-30 -6,-16 6,-16" fill="#7a2e1a"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#3a2a1a">N</text>
  </g>

  <g transform="translate(70,110)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="60" y1="-5" x2="60" y2="5" stroke="#3a2a1a" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2a1a">≈10 m</text>
  </g>

  <!-- ===================================================== -->
  <!-- FORT WALLS — x 290–710, y 140–480. Fort's back is to    -->
  <!-- the north (settled country); gate faces south.          -->
  <!-- ===================================================== -->
  <rect x="290" y="140" width="420" height="340" fill="#d9c69c" stroke="#5a4530" stroke-width="6"/>

  <!-- ===================================================== -->
  <!-- PATIO interior                                          -->
  <!-- ===================================================== -->
  <text x="500" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5a4530">el patio</text>
  <text x="500" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#7a2e1a">tierra — NO es piso seguro</text>

  <!-- cuartel, west interior -->
  <rect x="310" y="200" width="100" height="120" fill="#c9ac82" stroke="#3a2a1a" stroke-width="3"/>
  <text x="360" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3a2a1a">cuartel</text>
  <text x="360" y="273" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">escritorio</text>
  <text x="360" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#3a6a3a">piso seguro</text>

  <!-- well -->
  <circle cx="500" cy="230" r="14" fill="#8a9aa8" stroke="#3a2a1a" stroke-width="2"/>
  <text x="500" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">aljibe</text>

  <!-- hitching rail -->
  <g stroke="#5a4530" stroke-width="3">
    <line x1="440" y1="210" x2="470" y2="210"/>
    <line x1="446" y1="204" x2="446" y2="216"/>
    <line x1="464" y1="204" x2="464" y2="216"/>
  </g>
  <text x="455" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">palenque</text>

  <!-- smithy -->
  <rect x="550" y="212" width="34" height="28" fill="#b89870" stroke="#3a2a1a" stroke-width="2"/>
  <text x="567" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">fragua</text>

  <!-- ranchos, east interior -->
  <g fill="#c9ac82" stroke="#3a2a1a" stroke-width="2">
    <rect x="630" y="170" width="42" height="30"/>
    <rect x="630" y="210" width="42" height="30"/>
    <rect x="630" y="250" width="42" height="30"/>
  </g>
  <text x="651" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">ranchos</text>

  <!-- polvorín, south-central interior (against the gate wall) -->
  <rect x="440" y="380" width="76" height="75" fill="#b89870" stroke="#3a2a1a" stroke-width="4"/>
  <text x="478" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3a2a1a">polvorín</text>
  <text x="478" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">Ledesma</text>
  <text x="478" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#3a6a3a">piso seguro</text>
  <line x1="470" y1="453" x2="486" y2="453" stroke="#7a2e1a" stroke-width="4"/>

  <!-- ===================================================== -->
  <!-- GATE break, SOUTH wall (y=480)                          -->
  <!-- ===================================================== -->
  <line x1="290" y1="480" x2="463" y2="480" stroke="#5a4530" stroke-width="6"/>
  <line x1="537" y1="480" x2="710" y2="480" stroke="#5a4530" stroke-width="6"/>
  <g stroke="#3a2a1a" stroke-width="4">
    <line x1="463" y1="480" x2="455" y2="488"/>
    <line x1="537" y1="480" x2="545" y2="488"/>
  </g>
  <text x="500" y="507" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#3a2a1a">portón sur</text>
  <text x="500" y="521" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a4530">(colgando, abierto)</text>

  <!-- ===================================================== -->
  <!-- ROAD stub from gate down to the ditch causeway          -->
  <!-- ===================================================== -->
  <line x1="500" y1="488" x2="500" y2="498" stroke="#a08856" stroke-width="10" stroke-dasharray="2 8" opacity="0.6"/>
  <line x1="500" y1="536" x2="500" y2="555" stroke="#a08856" stroke-width="10" stroke-dasharray="2 8" opacity="0.6"/>

  <!-- ===================================================== -->
  <!-- LA ZANJA — a STRAIGHT line south of the fort, not a     -->
  <!-- moat. Continues off the map both ways.                  -->
  <!-- ===================================================== -->
  <rect x="120" y="555" width="360" height="38" fill="url(#hatch)" stroke="#5a4530" stroke-width="2"/>
  <rect x="520" y="555" width="360" height="38" fill="url(#hatch)" stroke="#5a4530" stroke-width="2"/>

  <!-- causeway across the gap -->
  <g stroke="#7a6144" stroke-width="4">
    <line x1="484" y1="563" x2="516" y2="563"/>
    <line x1="484" y1="574" x2="516" y2="574"/>
    <line x1="484" y1="585" x2="516" y2="585"/>
  </g>

  <!-- "continues for leagues" markers, both ends -->
  <g stroke="#5a4530" stroke-width="2" stroke-dasharray="3 4">
    <line x1="60" y1="574" x2="118" y2="574"/>
    <line x1="882" y1="574" x2="930" y2="574"/>
  </g>
  <text x="55" y="578" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#5a4530">←</text>
  <text x="935" y="578" text-anchor="start" font-family="Georgia, serif" font-size="16" fill="#5a4530">→</text>

  <!-- three blast holes, all on the straight ditch -->
  <circle cx="250" cy="574" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>
  <circle cx="750" cy="574" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>
  <circle cx="420" cy="574" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>

  <text x="250" y="613" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 1</text>
  <text x="750" y="613" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 2</text>
  <text x="420" y="613" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 3 → Calfú</text>

  <text x="500" y="632" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5a4530">la zanja — línea recta, 4–5 m de profundidad, sigue varias leguas en ambas direcciones</text>

  <!-- LOS MOJONES — the above-ground warning cairns (Clue 3), clear of
       everything else in the left margin, west of Pozo 1 -->
  <g fill="#8a7a5a" stroke="#3a2a1a" stroke-width="1">
    <circle cx="155" cy="600" r="4"/>
    <circle cx="167" cy="596" r="4"/>
    <circle cx="179" cy="600" r="4"/>
    <circle cx="191" cy="596" r="4"/>
  </g>
  <text x="173" y="622" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#3a2a1a">los mojones</text>
  <text x="173" y="634" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#5a4530">(Pista 3)</text>

  <!-- ===================================================== -->
  <!-- CAMPO ABIERTO (south of the ditch, cart road, traders) -->
  <!-- ===================================================== -->
  <line x1="500" y1="593" x2="500" y2="660" stroke="#a08856" stroke-width="10" stroke-dasharray="2 10" opacity="0.6"/>

  <text x="500" y="665" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5a4530" font-style="italic">campo abierto — camino de carreta</text>

  <g font-family="Georgia, serif">
    <circle cx="430" cy="695" r="9" fill="#8a3a2a"/>
    <circle cx="460" cy="705" r="9" fill="#8a3a2a"/>
    <circle cx="410" cy="720" r="9" fill="#8a3a2a"/>
    <text x="440" y="745" text-anchor="middle" font-size="14" fill="#3a2a1a">Millaray · Painén · Relmu</text>
    <text x="440" y="762" text-anchor="middle" font-size="12" font-style="italic" fill="#5a4530">(≈70 m de la zanja, inmóviles)</text>
  </g>

  <g transform="translate(650,650)">
    <ellipse rx="22" ry="10" fill="#6a5138" opacity="0.85"/>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">caballo muerto</text>
  </g>

  <text x="500" y="805" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5a4530">Ver "El Desenlace" en scenario.md — colapsar los túneles y/o matar a La Vieja.</text>
</svg>
