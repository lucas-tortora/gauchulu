<?xml version="1.0" encoding="UTF-8"?>
<!--
  FORTÍN SANTA BÁRBARA — MAPA DEL FUERTE Y EL SÓTANO
  "Lo que se Agarra del Subterráneo" — one-shot, 1826

  Top panel: the fort, the zanja (ditch) with its three blast holes, and the
  open field where the traders are frozen. North is up.
  Bottom panel: El Umbral — the basement chamber under the cuartel trapdoor
  / collapsed exterior stair, the arranged stones, the sealed slab, and the
  short passage behind it to the idol.

  Not to strict scale — a running map, not a survey.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#f4ecd8"/>
      <stop offset="80%" stop-color="#e6d8b8"/>
      <stop offset="100%" stop-color="#c9b78e"/>
    </radialGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8a6a4a" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <radialGradient id="holeGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a2a1a"/>
      <stop offset="100%" stop-color="#1a0e08"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1300" fill="url(#parchment)"/>

  <!-- ===================================================== -->
  <!-- TITLE / COMPASS / SCALE                                 -->
  <!-- ===================================================== -->
  <text x="500" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#3a2a1a">FORTÍN SANTA BÁRBARA</text>
  <text x="500" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#5a4530">1826 — mapa de mesa, no a escala</text>

  <g transform="translate(895,95)">
    <circle r="34" fill="#f4ecd8" stroke="#5a4530" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#5a4530" stroke-width="1.5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#5a4530" stroke-width="1.5"/>
    <polygon points="0,-30 -6,-16 6,-16" fill="#7a2e1a"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#3a2a1a">N</text>
  </g>

  <g transform="translate(70,110)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#3a2a1a" stroke-width="2"/>
    <line x1="60" y1="-5" x2="60" y2="5" stroke="#3a2a1a" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2a1a">≈10 m</text>
  </g>

  <!-- ===================================================== -->
  <!-- CAMPO ABIERTO (north of the gate, cart road, traders)  -->
  <!-- ===================================================== -->
  <text x="500" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5a4530" font-style="italic">campo abierto — camino de carreta</text>

  <line x1="500" y1="120" x2="500" y2="290" stroke="#a08856" stroke-width="10" stroke-dasharray="2 10" opacity="0.6"/>

  <g font-family="Georgia, serif">
    <circle cx="430" cy="175" r="9" fill="#8a3a2a"/>
    <circle cx="460" cy="185" r="9" fill="#8a3a2a"/>
    <circle cx="410" cy="200" r="9" fill="#8a3a2a"/>
    <text x="440" y="225" text-anchor="middle" font-size="14" fill="#3a2a1a">Millaray · Painén · Relmu</text>
    <text x="440" y="242" text-anchor="middle" font-size="12" font-style="italic" fill="#5a4530">(≈70 m del portón, inmóviles)</text>
  </g>

  <g transform="translate(620,255)">
    <ellipse rx="22" ry="10" fill="#6a5138" opacity="0.85"/>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">caballo muerto</text>
  </g>

  <!-- ===================================================== -->
  <!-- GATE label (kept clear of the wall break below)         -->
  <!-- ===================================================== -->
  <text x="500" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#3a2a1a">portón norte</text>
  <text x="500" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a4530">(colgando, abierto)</text>

  <!-- ===================================================== -->
  <!-- FORT WALLS — x 290–710, y 290–630                       -->
  <!-- ===================================================== -->
  <rect x="290" y="290" width="420" height="340" fill="#d9c69c" stroke="#5a4530" stroke-width="6"/>

  <!-- gate break -->
  <line x1="290" y1="290" x2="463" y2="290" stroke="#5a4530" stroke-width="6"/>
  <line x1="537" y1="290" x2="710" y2="290" stroke="#5a4530" stroke-width="6"/>
  <g stroke="#3a2a1a" stroke-width="4">
    <line x1="463" y1="290" x2="455" y2="282"/>
    <line x1="537" y1="290" x2="545" y2="282"/>
  </g>

  <!-- ===================================================== -->
  <!-- PATIO interior                                          -->
  <!-- ===================================================== -->
  <text x="500" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5a4530">el patio</text>

  <!-- cuartel, west interior -->
  <rect x="310" y="350" width="100" height="130" fill="#c9ac82" stroke="#3a2a1a" stroke-width="3"/>
  <text x="360" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3a2a1a">cuartel</text>
  <text x="360" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">escritorio</text>
  <rect x="346" y="434" width="28" height="18" fill="none" stroke="#7a2e1a" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="360" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7a2e1a">trampa ↓ sótano</text>

  <!-- well -->
  <circle cx="500" cy="400" r="14" fill="#8a9aa8" stroke="#3a2a1a" stroke-width="2"/>
  <text x="500" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">aljibe</text>

  <!-- hitching rail -->
  <g stroke="#5a4530" stroke-width="3">
    <line x1="440" y1="380" x2="470" y2="380"/>
    <line x1="446" y1="374" x2="446" y2="386"/>
    <line x1="464" y1="374" x2="464" y2="386"/>
  </g>
  <text x="455" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">palenque</text>

  <!-- smithy -->
  <rect x="550" y="382" width="34" height="28" fill="#b89870" stroke="#3a2a1a" stroke-width="2"/>
  <text x="567" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">fragua</text>

  <!-- ranchos, east interior wall — kept well inside x=710 wall edge -->
  <g fill="#c9ac82" stroke="#3a2a1a" stroke-width="2">
    <rect x="630" y="320" width="42" height="30"/>
    <rect x="630" y="360" width="42" height="30"/>
    <rect x="630" y="400" width="42" height="30"/>
  </g>
  <text x="651" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">ranchos</text>

  <!-- polvorín, south-central interior -->
  <rect x="440" y="540" width="76" height="60" fill="#b89870" stroke="#3a2a1a" stroke-width="4"/>
  <text x="478" y="566" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3a2a1a">polvorín</text>
  <text x="478" y="582" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3a2a1a">Ledesma</text>
  <line x1="470" y1="600" x2="486" y2="600" stroke="#7a2e1a" stroke-width="4"/>

  <!-- ===================================================== -->
  <!-- LA ZANJA — outside the walls, south + east runs         -->
  <!-- ===================================================== -->
  <rect x="270" y="630" width="452" height="38" fill="url(#hatch)" stroke="#5a4530" stroke-width="2"/>
  <rect x="710" y="290" width="38" height="378" fill="url(#hatch)" stroke="#5a4530" stroke-width="2"/>

  <text x="770" y="490" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2a1a" transform="rotate(90 770 490)">la zanja — 4–5 m de profundidad</text>

  <!-- three blast holes, all clearly inside the ditch band, none inside the walls -->
  <circle cx="370" cy="649" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>
  <text x="370" y="695" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 1</text>

  <circle cx="729" cy="420" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>
  <text x="756" y="425" text-anchor="start" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 2</text>

  <circle cx="610" cy="649" r="16" fill="url(#holeGrad)" stroke="#1a0e08" stroke-width="2"/>
  <text x="610" y="695" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">pozo 3 → Calfú</text>

  <!-- exterior collapsed stair — its own marker, clear of both holes -->
  <g transform="translate(490,638)">
    <path d="M-10,0 L2,10 L-10,20 L2,30" fill="none" stroke="#7a2e1a" stroke-width="2.5"/>
  </g>
  <text x="490" y="695" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7a2e1a">escalera</text>
  <text x="490" y="708" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7a2e1a">colapsada</text>

  <!-- ===================================================== -->
  <!-- CONNECTOR TO BASEMENT PANEL                             -->
  <!-- ===================================================== -->
  <line x1="500" y1="720" x2="500" y2="800" stroke="#7a2e1a" stroke-width="2" stroke-dasharray="6 6"/>
  <polygon points="500,808 492,792 508,792" fill="#7a2e1a"/>
  <text x="520" y="770" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#7a2e1a">ver sótano ↓</text>

  <!-- ===================================================== -->
  <!-- BASEMENT PANEL — EL UMBRAL                              -->
  <!-- ===================================================== -->
  <line x1="60" y1="835" x2="940" y2="835" stroke="#5a4530" stroke-width="1.5" opacity="0.5"/>
  <text x="500" y="870" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#3a2a1a">EL SÓTANO — EL UMBRAL</text>
  <text x="500" y="893" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5a4530">bajo la trampa del cuartel / por la escalera colapsada</text>

  <rect x="220" y="945" width="560" height="260" fill="#e6d8b8" stroke="#3a2a1a" stroke-width="4"/>

  <text x="260" y="932" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">bajada</text>
  <g stroke="#5a4530" stroke-width="3" fill="none">
    <path d="M260,945 L260,985"/>
    <path d="M245,955 L275,955"/>
    <path d="M245,970 L275,970"/>
  </g>

  <!-- arranged stones (simple spiral) + bone arc -->
  <g fill="#8a7a5a" stroke="#3a2a1a" stroke-width="1.5">
    <circle cx="355" cy="1025" r="7"/>
    <circle cx="380" cy="1010" r="7"/>
    <circle cx="405" cy="1003" r="7"/>
    <circle cx="430" cy="1003" r="7"/>
    <circle cx="455" cy="1010" r="7"/>
    <circle cx="480" cy="1025" r="7"/>
  </g>
  <path d="M345,1050 Q417,1080 490,1050" fill="none" stroke="#c9c0a8" stroke-width="4" stroke-dasharray="9 5"/>
  <text x="417" y="1100" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#3a2a1a">piedras talladas (espiral) + arco de huesos</text>

  <!-- sealed slab with a clean single spiral -->
  <rect x="600" y="985" width="34" height="130" fill="#9a8262" stroke="#3a2a1a" stroke-width="3"/>
  <path d="M617,1030 m0,-14 a14,14 0 1,1 -9.9,23.9 a9,9 0 1,1 6.3,-15.4 a4,4 0 1,1 -2.9,6.8"
        fill="none" stroke="#3a2a1a" stroke-width="1.6"/>
  <text x="617" y="1135" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3a2a1a">la laja sellada</text>
  <text x="617" y="1151" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5a4530">espiral hacia adentro</text>

  <!-- passage behind + idol -->
  <text x="695" y="998" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7a2e1a">pasaje (3–4 m, tras abrir)</text>
  <rect x="634" y="1008" width="90" height="50" fill="none" stroke="#7a2e1a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="700" cy="1033" r="8" fill="#1a0e08"/>
  <text x="700" y="1078" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3a2a1a">ídolo / tapón</text>

  <text x="500" y="1240" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5a4530">Ver "El Umbral" en scenario.md para la mecánica de apertura y las tres piedras.</text>
</svg>
